# Mantiene index.html + los 9 {idioma}.html siempre al día en los 10 idiomas,
# aunque datos_oficiales.json se edite directamente en IONOS (sin pasar por
# el gestor ni por un PC con Node). Cada vez que corre:
#   1. Descarga de IONOS el datos_oficiales.json actual (la fuente de verdad
#      real vive en el hosting, no en este repo).
#   2. Ejecuta el MISMO _fuente/build.js que se usa en local — sin
#      reimplementar nada, así que la calidad (traducciones + transliteración
#      de nombres a otros alfabetos) es idéntica a un build local.
#   3. Sube por SFTP los 10 HTML regenerados a IONOS.
#
# Requiere 3 secrets del repo (Settings -> Secrets and variables -> Actions),
# los mismos que usas en tu cliente SFTP (FileZilla/WinSCP/Cyberduck):
#   FTP_SERVER    el host SFTP de IONOS
#   FTP_USERNAME  tu usuario
#   FTP_PASSWORD  tu contraseña
# Se escriben directamente en la web de GitHub; nadie más los ve ni quedan
# en el código.

name: Reconstruir y publicar

on:
  schedule:
    - cron: '*/20 * * * *'   # cada 20 minutos
  workflow_dispatch: {}       # botón "Run workflow" para forzarlo a mano
  push:
    branches: [main]          # también al subir cambios de código (dict.js, etc.)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias (jsdom)
        run: npm ci

      # datos_oficiales.json ya se sirve en HTTPS en el propio sitio (con
      # Cache-Control: no-cache, así que esto siempre pide la versión real,
      # nunca una copia cacheada). Se prefiere a FTP para esta descarga:
      # FTP necesita una conexión de datos aparte (modo pasivo) que muchas
      # veces se cuelga entre el runner de GitHub y el hosting compartido
      # (fue justo lo que pasó: curl exit code 28, timeout) — HTTPS es una
      # sola conexión, sin ese problema.
      - name: Descargar datos_oficiales.json actual de IONOS
        run: |
          curl -sf --connect-timeout 15 --max-time 60 \
            "https://superligafrontier.es/datos_oficiales.json" \
            -o datos_oficiales.json
          echo "Descargado: $(wc -c < datos_oficiales.json) bytes"

      - name: Reconstruir index.html y los 9 idiomas
        run: node _fuente/build.js

      # IONOS solo acepta SFTP (confirmado: el intento anterior con FTPS dio
      # "connect ETIMEDOUT" en el puerto 21 -- ni siquiera llega a abrir la
      # conexión de control, el puerto no está expuesto). SFTP es un
      # protocolo distinto de FTP/FTPS pese al nombre parecido (va sobre
      # SSH, una sola conexión, sin el lío de canal de datos aparte que
      # tiene FTP clásico), así que hace falta una herramienta distinta:
      # lftp sí sabe hablar los tres. Se suben solo los ficheros que este
      # build realmente regenera -- ni más rápido ni más simple sería
      # sincronizar la carpeta entera con exclusiones.
      - name: Publicar los cambios en IONOS (SFTP)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2;
                mput index.html en.html pt.html it.html fr.html ja.html ko.html pl.html bg.html sr.html;
                bye" \
            sftp://${{ secrets.FTP_SERVER }}
